ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

; 特殊服务：仅保留真正需要独立切换的分组
ruleset=🔔 Adobe&CDR联网控制,https://raw.githubusercontent.com/WenYe2021/clashrule/refs/heads/main/adobe.list
ruleset=🔔 Adobe&CDR联网控制,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/AdobeActivation/AdobeActivation.list
ruleset=🔔 Adobe&CDR联网控制,https://raw.githubusercontent.com/WenYe2021/clashrule/refs/heads/main/cdr.list
ruleset=🔔 Adobe&CDR联网控制,clash-classic:https://raw.githubusercontent.com/ignaciocastro/a-dove-is-dumb/refs/heads/main/clash.yaml


; 视频、音乐、游戏与国内外媒体
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
